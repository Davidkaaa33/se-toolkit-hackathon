version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - stack-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=stack_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SESSION_SECRET=stack-secret-change-in-prod
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stack-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=stack_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stack-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  stack-network:
    driver: bridge
